<!DOCTYPE html>
<html lang="de">
<head>

    <title>Kneipentour</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body id="body" class="dark-mode">

<div id="logo">
    <img id="logo-dark" src="images/logo_dark.svg" alt="Logo der Fachschaft IT">
    <img id="logo-light" src="images/logo_light.svg" alt="Logo der Fachschaft IT">
</div>

<div id="return-button">
    <a href="../" title="Zurück zur Übersicht" aria-label="Zurück zur Übersicht">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
            <path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288 416 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-306.7 0L214.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/>

    <a onclick="toggleColorMode()">

<div id="container">

    <div id="left">
        <img id="poster" src="images/KneipentourWS2026.jpg" alt="Plakat zum Spieleabend">
    </div>

    <div id="right">

        <h1>Ersti Kneipentour 16.10.2026</h1>
        <p><strong>Wer: Jeder ist wilkommen, egal welcher Fakultät! Bringt auch gerne Freunde mit.</strong></p>
        <br>
        <p><strong>Treffpunkt: Komma Esslingen</strong></p>
        <br>
        <p><strong>Eure Fachschaften</strong></p>

    </div>
</div>


<script>
    function toggleColorMode() {
        document.getElementById("body").classList.toggle("dark-mode");
    }
</script>

</body>
</html>
