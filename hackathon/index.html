<!DOCTYPE html>
<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Hackathon – Fachschaft IT</title>

</head>
<body id="body" class="dark-mode">
    <div id="logo">
        <img id="logo-dark" src="images/logo_dark.svg" alt="Logo der Fachschaft IT">

    <div id="return-button">
        <a href="../" title="Zurück zur Übersicht" aria-label="Zurück zur Übersicht">

    <script>
        function toggleColorMode() {
            document.getElementById("body").classList.toggle("dark-mode");
        }
    </script>

</html>
